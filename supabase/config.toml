
project_id = "lwuncvddikvqtcmsabpw"

[functions.send-custom-auth-email]
verify_jwt = false

# Guests book without signing in, so this must be callable anonymously.
[functions.send-booking-notification]
verify_jwt = false

# Deletion identifies the user from their own JWT, so verification stays ON.
[functions.delete-account]
verify_jwt = true

# Guests manage bookings via an emailed token, with no account, so this must
# be callable anonymously. Authorisation is the unguessable token itself.
[functions.manage-booking]
verify_jwt = false

# Fires during sign-up, before the user has a session, so it must be callable
# anonymously. It verifies the address against auth.users before sending.
[functions.send-signup-notification]
verify_jwt = false

# Fires right after the host's own write. Reads every detail back from the
# database with the service role, so nothing from the caller is trusted.
[functions.send-listing-notification]
verify_jwt = false
