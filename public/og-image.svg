<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B1F17"/>

  <!-- Subtle green radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#15794C" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#0B1F17" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gold top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="#C8A24B"/>

  <!-- Logo circle -->
  <circle cx="600" cy="200" r="64" fill="#0B1F17" stroke="#C8A24B" stroke-width="3"/>
  <text x="600" y="222" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#C8A24B" text-anchor="middle">T</text>

  <!-- Brand name -->
  <text x="600" y="320" font-family="Arial Black, Arial, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">TeeBnB</text>

  <!-- Tagline -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#C8A24B" text-anchor="middle" letter-spacing="2">WHERE GOLF MEETS HOME</text>

  <!-- Divider -->
  <rect x="480" y="420" width="240" height="2" fill="#C8A24B" opacity="0.5"/>

  <!-- Description -->
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="22" fill="#A8B9B0" text-anchor="middle">Stay near the world's finest golf courses</text>
  <text x="600" y="502" font-family="Arial, sans-serif" font-size="22" fill="#A8B9B0" text-anchor="middle">Book unique stays from local hosts</text>

  <!-- Domain -->
  <text x="600" y="575" font-family="Arial, sans-serif" font-size="20" fill="#5C6B62" text-anchor="middle" letter-spacing="1">teebnb.com</text>

  <!-- Golf ball dots decoration -->
  <circle cx="120" cy="315" r="6" fill="#C8A24B" opacity="0.3"/>
  <circle cx="145" cy="315" r="6" fill="#C8A24B" opacity="0.3"/>
  <circle cx="170" cy="315" r="6" fill="#C8A24B" opacity="0.3"/>
  <circle cx="1030" cy="315" r="6" fill="#C8A24B" opacity="0.3"/>
  <circle cx="1055" cy="315" r="6" fill="#C8A24B" opacity="0.3"/>
  <circle cx="1080" cy="315" r="6" fill="#C8A24B" opacity="0.3"/>
</svg>
