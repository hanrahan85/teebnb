<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDD99A"/>
      <stop offset="45%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9A7228"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDD99A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9A7228"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&amp;family=Lato:wght@300;400&amp;display=swap');
    </style>
  </defs>

  <!-- ── T LETTERFORM (white, classic serif) ── -->
  <!-- Top horizontal bar -->
  <rect x="205" y="30" width="190" height="20" fill="white"/>
  <!-- Left end serif bump -->
  <rect x="195" y="27" width="22" height="9" rx="1" fill="white"/>
  <!-- Right end serif bump -->
  <rect x="383" y="27" width="22" height="9" rx="1" fill="white"/>
  <!-- Inner top-corner fills to make it look thick -->
  <rect x="205" y="30" width="10" height="26" fill="white"/>
  <rect x="385" y="30" width="10" height="26" fill="white"/>
  <!-- Stem -->
  <rect x="290" y="48" width="20" height="152" fill="white"/>
  <!-- Bottom stem serif -->
  <rect x="275" y="195" width="50" height="9" rx="1" fill="white"/>

  <!-- ── GOLD FLAGPOLE (runs through the T) ── -->
  <line x1="300" y1="4" x2="300" y2="206" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- ── GOLF FLAG (gold pennant) ── -->
  <path d="M302.5 6 L302.5 50 L342 28 Z" fill="url(#gold)"/>

  <!-- ── POLE TIP ball ── -->
  <circle cx="300" cy="4" r="4.5" fill="url(#gold)"/>

  <!-- ── GOLD SWOOSH (arc around midpoint of T) ── -->
  <path d="M208,148 C238,108 268,128 300,148 C332,168 362,120 392,110"
        fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- ── GOLF TEE at bottom of pole ── -->
  <!-- Cup/head of tee -->
  <path d="M292,200 L308,200 L305,214 L295,214 Z" fill="white"/>
  <!-- Spike -->
  <rect x="298" y="213" width="4" height="16" rx="2" fill="white"/>

  <!-- ── WORDMARK: TeeBnB ── -->
  <text x="300" y="268" text-anchor="middle"
        font-family="'Cormorant Garamond', 'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="64" font-weight="600" letter-spacing="1">
    <tspan fill="white">Tee</tspan><tspan fill="url(#goldV)">BnB</tspan>
  </text>

  <!-- ── DECORATIVE RULE with golf ball ── -->
  <line x1="108" y1="282" x2="271" y2="282" stroke="url(#gold)" stroke-width="1"/>
  <circle cx="300" cy="282" r="7.5" fill="url(#gold)"/>
  <line x1="329" y1="282" x2="492" y2="282" stroke="url(#gold)" stroke-width="1"/>

  <!-- ── TAGLINE ── -->
  <text x="300" y="311" text-anchor="middle"
        font-family="'Lato', 'Helvetica Neue', Arial, sans-serif"
        font-size="12.5" letter-spacing="5.5" fill="white" opacity="0.82"
        font-weight="300">PLAY MORE. STAY BETTER.</text>
</svg>
